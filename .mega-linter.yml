# MegaLinter configuration
# https://megalinter.io/latest/configuration/

# Allow up to 10% code duplication (ConditionalBranchMermaidRenderer inherits
# many rendering patterns from MermaidRenderer, leading to expected overlap).
COPYPASTE_JSCPD_ARGUMENTS: "--threshold 10"

# Spelling errors and Kingfisher false positives are informational only –
# they should never block a PR.
# Kingfisher flags the redacted AUTHORIZATION header in .git/config as a
# "GitHub App Server-to-Server Token"; this is a false positive since the
# value is already replaced with *** by Git's credential helper.
DISABLE_ERRORS_LINTERS:
  - SPELL_CSPELL
  - REPOSITORY_KINGFISHER
  # snapshots/*.md are auto-generated Mermaid diagram fixtures committed as
  # test golden files. Their single-line gitGraph directives routinely
  # exceed markdownlint's default MD013 line-length limit (400 chars) and
  # are not meant to be hand-edited/wrapped, so treat markdownlint findings
  # on them as informational only rather than blocking every future PR.
  - MARKDOWN_MARKDOWNLINT
  # PMD's bundled default ruleset (java-pmd-ruleset.xml, provided by the
  # MegaLinter image, not owned by this repo) includes LoosePackageCoupling,
  # which requires an explicit list of packages/classes to check. Without one
  # it reports a hard config error ("No packages or classes specified") that
  # marks PMD executionSuccessful=False and blocks every PR, independent of
  # any actual code issue. Treat PMD findings as informational until we ship
  # a custom ruleset that configures or drops that rule.
  - JAVA_PMD

# Use a project-specific Checkstyle config that enforces real bug-catching
# rules while allowing the existing code conventions (long lines, no Javadoc).
JAVA_CHECKSTYLE_CONFIG_FILE: checkstyle.xml

# Nextflow (.nf) files use a DSL2 superset of Groovy that is not valid plain
# Groovy. Exclude them from Groovy linting to avoid false positives such as
# "duplicate variable declaration" across script:/stub: blocks and
# "unreachable code" after Nextflow labeled-branch return statements.
GROOVY_NPM_GROOVY_LINT_FILTER_REGEX_EXCLUDE: ".*\\.nf$"

# trivy walks the whole workspace itself, and checkov runs at the same time.
# Checkov's GitHub-configuration scan writes and then removes github_conf/, so
# trivy regularly stats a file that has just disappeared and aborts the scan:
#
#   FATAL run error: fs scan error: ... unable to filter filesystem: walk error
#   range error: stat github_conf/branch_protection_rules.json: no such file or
#   directory
#
# Nothing in that directory belongs to this repository, so skip it.
REPOSITORY_TRIVY_ARGUMENTS:
  - "--skip-dirs"
  - "github_conf"
